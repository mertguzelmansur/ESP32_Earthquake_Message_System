<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Earthquake System</title>
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-microchip"></i>
                <h3>System Uptime</h3>
                <div id="system-uptime" class="stat-value">0:00:00</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-memory"></i>
                <h3>Free Memory</h3>
                <div id="free-memory" class="stat-value">0 KB</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-network-wired"></i>
                <h3>Connected Devices</h3>
                <div id="connected-devices" class="stat-value">0</div>
            </div>
        </div>

        <div class="section">
            <h2><i class="fas fa-cogs"></i> System Control</h2>
            <button onclick="resetESP32()" class="danger">
                <i class="fas fa-power-off"></i> Reset ESP32
            </button>
            <button onclick="toggleEmergencyMode()">
                <i class="fas fa-exclamation-triangle"></i> Toggle Emergency Mode
            </button>
            <button onclick="clearAllData()">
                <i class="fas fa-trash"></i> Clear All Data
            </button>
            
            <form onsubmit="updateSSID(event)" class="form-group">
                <input type="text" id="ssid" placeholder="New SSID" required>
                <button type="submit"><i class="fas fa-wifi"></i> Update SSID</button>
            </form>

            <form onsubmit="updateThreshold(event)" class="form-group">
                <input type="number" id="threshold" step="0.1" placeholder="Earthquake Sensitivity" required>
                <button type="submit"><i class="fas fa-sliders-h"></i> Update Sensitivity</button>
            </form>
        </div>

        <div class="section">
            <h2><i class="fas fa-chart-line"></i> System Monitoring</h2>
            <canvas id="accelerometer-chart"></canvas>
            <div id="sensor-data"></div>
        </div>

        <div class="section">
            <h2><i class="fas fa-comments"></i> Messages</h2>
            <div id="admin-messages" class="message-container"></div>
            <button onclick="clearMessages()">Clear Messages</button>
        </div>

        <div class="section">
            <h2><i class="fas fa-hands-helping"></i> Help Requests</h2>
            <div id="admin-help-requests" class="message-container"></div>
            <button onclick="clearHelpRequests()">Clear Help Requests</button>
        </div>

        <div class="section">
            <h2><i class="fas fa-map-marker-alt"></i> User Locations</h2>
            <div id="locations-list" class="message-container"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
